[project]
name = "biomedical-knowledge-lookup"
version = "1.1.0"
description = "Unified biological concept lookup across 29+ biomedical knowledge sources including BioPortal, OLS, UMLS, ChEMBL, DisGeNET, and more"
authors = [
    {name = "Jonas Heinicke", email = "jonas.heinicke@helmholtz-hzi.de"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies", "scripts", "classifiers"]
urls = {Documentation = "https://jonasheinickeBio.github.io/biomedical-knowledge-lookup/", "Issue Tracker" = "https://github.com/JonasHeinickeBio/biomedical-knowledge-lookup/issues", "Changelog" = "https://github.com/JonasHeinickeBio/biomedical-knowledge-lookup/blob/main/CHANGELOG.md"}

[project.scripts]
knowledge-lookup = "knowledge_lookup.__main__:app"

[project.optional-dependencies]
umls = ["umls-python-client>=1.2.0,<2.0.0"]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "biomedical-knowledge-lookup"
packages = [{ include = "knowledge_lookup", from = "src" }]
include = ["src/knowledge_lookup/py.typed"]
version = "1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.0.0"
pytest-timeout = "^2.2.0"
ruff = "^0.1.0"
mypy = "^1.0.0"
jupyter = "^1.0.0"
ipykernel = "^6.0.0"
pre-commit = "^4.5.1"
linkml = "^1.8.0"
linkml-runtime = "^1.8.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0.0"
sphinx-rtd-theme = "^2.0.0"

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.9.0"
requests = "^2.31.0"
rdflib = "^7.0.0"
pandas = "^2.0.0"
pydantic = "^2.0.0"
tenacity = "^8.2.0"
backoff = "^2.2.0"
python-dotenv = "^1.0.0"
rich = "^13.0.0"
typer = ">=0.12.0,<1.0.0"
chembl-webresource-client = "^0.10.9"
umls-python-client = { version = "^1.2.0", optional = true }
tyto = "^1.4"
bioservices = "^1.16.0"
setuptools = "^82.0.1"

[tool.poetry.extras]
umls = ["umls-python-client"]

[line-length]
line-length = 99

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "E501", # line too long (enforced by ruff format, not check)
    "UP007", # use X | Y for type annotations (generated model compatibility)
]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "network: marks tests that require network access",
    "functional: marks tests as functional adapter tests",
    "api: marks tests that require API key authentication",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
