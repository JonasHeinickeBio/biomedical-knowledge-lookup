name: Draft Release

# Runs on every push to `main` (i.e. every staging -> main promotion) *and*
# on every PR into `main` being merged. Both triggers are needed: a PR
# merged via GitHub's auto-merge (as staging.yml's promote-to-main job sets
# up) is performed using the default GITHUB_TOKEN, and GitHub's anti-loop
# protection means a push made with that token does NOT fire other
# workflows' `on: push` triggers — confirmed empirically (the first
# staging -> main auto-merge produced no `push` event on main at all). The
# `pull_request: closed` trigger is a *different* event class, tied to the
# PR resource's own state transition rather than the push that resulted
# from it, and isn't subject to that same suppression — so it's the
# reliable trigger for anything merged by a workflow, while `push` stays as
# a fallback for a human merging by hand.
#
# Cuts CHANGELOG.md's [Unreleased] section into a new dated version, commits
# that back to main, and opens a DRAFT GitHub Release for it — nothing is
# tagged or published yet. A maintainer reviews the draft (CHANGELOG diff,
# version number) and clicks "Publish release" when ready; publishing it
# creates the `vX.Y.Z` tag and fires publish.yml, which builds, verifies,
# and — after the "pypi" environment's approval gate — uploads to PyPI.
#
# This is the intended manual approval point before anything public happens.
# If [Unreleased] is empty (nothing merged since the last release), this
# workflow is a no-op.
#
# The CHANGELOG cut is committed on a new `release/vX.Y.Z` branch and landed
# via its own auto-merged PR, NOT pushed straight to main — main has a
# repository ruleset requiring every change go through a PR, which rejects
# even an `actions/checkout` + `git push origin HEAD:main` from this
# workflow's own token (confirmed: GH013, "Changes must be made through a
# pull request"). The draft release is created targeting that release
# branch's commit directly, in this same run, rather than waiting for the
# release PR to merge and re-trigger this workflow — by the time that
# second run happened, [Unreleased] would already be empty (this run just
# cut it) and it would see nothing to release. Targeting the branch works
# because a git ref only needs to exist *once*, at draft-creation time, for
# `gh release create`'s target commit to resolve — whether or not the
# branch itself still exists (or has since merged into main) by the time
# someone actually publishes the draft is irrelevant.
#
# `workflow_dispatch` is a manual fallback: GitHub only starts honoring a
# *newly added* trigger once the workflow file that defines it exists on the
# default branch — the very first PR that adds the `pull_request: closed`
# trigger above can't be caught by it (confirmed: PR #18, which added it,
# didn't fire this workflow when merged). Run this manually from the Actions
# tab if a merge to main doesn't produce a draft release within a minute or
# two and you don't want to wait for the next one to self-correct it.

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}  # manual escape hatch — see note below

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  # Never cancel a mid-flight release cut for a newer push; let it finish
  # and let the next push queue behind it instead.
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'JonasHeinickeBio/biomedical-knowledge-lookup' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.merged == true)

    steps:
    - uses: actions/checkout@v4
      with:
        ref: main  # for the pull_request trigger, check out main post-merge, not the PR head
        fetch-depth: 0  # need full tag history to compute the next version

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cut CHANGELOG.md, compute next version
      id: cut
      run: |
        set +e
        OUTPUT=$(python scripts/release/cut_changelog.py --github-output "$GITHUB_OUTPUT")
        STATUS=$?
        set -e
        echo "$OUTPUT"
        if [[ $STATUS -eq 2 ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        elif [[ $STATUS -ne 0 ]]; then
          exit "$STATUS"
        fi

    - name: Commit the cut CHANGELOG.md on a release branch, open a PR
      if: steps.cut.outputs.skip != 'true'
      id: branch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        BRANCH="release/v${{ steps.cut.outputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH"
        git add CHANGELOG.md
        git commit -m "chore(release): cut CHANGELOG for v${{ steps.cut.outputs.version }}"
        git push origin "$BRANCH"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

        PR_NUMBER=$(gh pr list --base main --head "$BRANCH" --json number --jq '.[0].number // empty')
        if [[ -z "$PR_NUMBER" ]]; then
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v${{ steps.cut.outputs.version }}" \
            --body "Lands the CHANGELOG cut for v${{ steps.cut.outputs.version }} on main. Separate from actually publishing the release — see the draft release this same workflow run creates, targeting this branch's commit directly."
          PR_NUMBER=$(gh pr list --base main --head "$BRANCH" --json number --jq '.[0].number')
        fi
        gh pr merge "$PR_NUMBER" --auto --merge || echo "::warning::Could not enable auto-merge on the release PR #$PR_NUMBER (branch $BRANCH) — merge it manually so main matches the draft release's CHANGELOG."

    - name: Create draft release
      if: steps.cut.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.cut.outputs.version }}" \
          --draft \
          --title "v${{ steps.cut.outputs.version }}" \
          --notes-file release_notes.md \
          --target "${{ steps.branch.outputs.branch }}"

    - name: Summary
      if: steps.cut.outputs.skip != 'true'
      run: |
        echo "### Draft release v${{ steps.cut.outputs.version }} created" >> "$GITHUB_STEP_SUMMARY"
        echo "Review it under the repo's Releases tab and click **Publish release** when ready." >> "$GITHUB_STEP_SUMMARY"
        echo "Publishing creates the \`v${{ steps.cut.outputs.version }}\` tag and triggers \`publish.yml\` (build -> attest -> PyPI, gated by the \"pypi\" environment's approval)." >> "$GITHUB_STEP_SUMMARY"

    - name: Summary (nothing to release)
      if: steps.cut.outputs.skip == 'true'
      run: echo "Nothing merged into [Unreleased] since the last release — no draft created." >> "$GITHUB_STEP_SUMMARY"
