name: Draft Release

# Turns CHANGELOG.md's [Unreleased] section into a draft GitHub Release.
#
# Runs on every push to `main`, i.e. every merged pull request. Merge with
# your own account (the merge button or `gh pr merge`): events caused by a
# workflow's GITHUB_TOKEN never trigger other workflows, which is why the old
# bot-merged staging -> main promotion never produced a draft.
#
# 1. scripts/release/cut_changelog.py moves [Unreleased] into a dated
#    `## [X.Y.Z]` section. The bump is read from the entries: a line starting
#    with `- **Breaking` means major, a `### Added` section minor, anything
#    else patch. An empty [Unreleased] section means there is nothing to do.
# 2. github-actions[bot] commits the cut CHANGELOG.md straight to main. That
#    push does not re-trigger this workflow.
# 3. A draft release vX.Y.Z is created on that commit with the section as
#    its notes.
#
# Nothing is tagged or published here. Publishing the draft creates the tag,
# which runs publish.yml. While a draft is unpublished, later merges only
# collect entries in [Unreleased]; publish or delete the draft first.
# `workflow_dispatch` runs the same steps by hand.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # never interrupt a release cut

jobs:
  draft-release:
    if: github.repository == 'JonasHeinickeBio/biomedical-knowledge-lookup'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0  # full tag history to compute the next version

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check for an unpublished draft
      id: pending
      run: |
        set -euo pipefail
        DRAFT=$(gh release list --limit 20 --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName // empty')
        echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
        if [[ -n "$DRAFT" ]]; then
          echo "::notice::Draft release $DRAFT is not published yet; [Unreleased] was left as it is."
        fi

    - name: Cut CHANGELOG.md, compute next version
      id: cut
      if: steps.pending.outputs.draft == ''
      run: |
        set +e
        OUTPUT=$(python scripts/release/cut_changelog.py --github-output "$GITHUB_OUTPUT")
        STATUS=$?
        set -e
        echo "$OUTPUT"
        if [[ $STATUS -eq 2 ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        elif [[ $STATUS -ne 0 ]]; then
          exit "$STATUS"
        fi

    - name: Commit the cut CHANGELOG.md to main
      id: commit
      if: steps.pending.outputs.draft == '' && steps.cut.outputs.skip != 'true'
      run: |
        set -euo pipefail
        VERSION="${{ steps.cut.outputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        git commit -m "chore(release): cut CHANGELOG for v$VERSION"
        # Another merge may have reached main since checkout: replay once.
        if ! git push origin HEAD:main; then
          git pull --rebase origin main
          git push origin HEAD:main
        fi
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Create draft release
      if: steps.commit.outputs.sha != ''
      run: |
        set -euo pipefail
        VERSION="${{ steps.cut.outputs.version }}"
        gh release create "v$VERSION" \
          --draft \
          --title "v$VERSION" \
          --notes-file release_notes.md \
          --target "${{ steps.commit.outputs.sha }}"
        {
          echo "### Draft release v$VERSION created"
          echo "Review it under **Releases** and click **Publish release** when ready."
          echo "Publishing creates the \`v$VERSION\` tag, which runs \`publish.yml\` (verify, build, attest, upload to PyPI)."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Summary (no draft created)
      if: steps.commit.outputs.sha == ''
      run: |
        if [[ -n "${{ steps.pending.outputs.draft }}" ]]; then
          echo "Draft release ${{ steps.pending.outputs.draft }} is still unpublished. Publish or delete it; the next push to main (or a manual run) cuts the next release." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Nothing in [Unreleased] since the last release; no draft created." >> "$GITHUB_STEP_SUMMARY"
        fi
