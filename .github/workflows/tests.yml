name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: false

    - name: Install Poetry
      run: |
        pip install --upgrade pip
        pip install poetry
        poetry --version

    - name: Install dependencies
      run: |
        poetry install --with dev --no-interaction

    - name: Check package build
      run: |
        poetry build --no-interaction

    - name: Run unit tests
      run: |
        poetry run pytest tests/unit -v --cov=knowledge_lookup --cov-report=xml --cov-report=term-missing --timeout=60

    - name: Run integration tests
      run: |
        poetry run pytest tests/integration -v -m integration --timeout=120

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  core-install:
    # Guarantee the base install stays lean: no optional/heavy deps, and the
    # package + all HTTP-only adapters still import.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build wheel
      run: |
        pip install --upgrade pip build
        python -m build --wheel
    - name: Install core only (no extras)
      run: pip install dist/*.whl
    - name: Assert heavy deps are absent
      run: |
        python - <<'PY'
        import importlib.util as u
        heavy = ["pandas", "chembl_webresource_client", "bioservices", "tyto", "langgraph"]
        present = [m for m in heavy if u.find_spec(m) is not None]
        assert not present, f"heavy deps leaked into the core install: {present}"
        PY
    - name: Import smoke test
      run: |
        python - <<'PY'
        import knowledge_lookup as kl
        from knowledge_lookup import CentralKnowledgeLookup, MultiSourceAnnotator, ADAPTER_CLASSES
        from knowledge_lookup.adapters import MondoAdapter, HPOAdapter, OLSAdapter, OxOAdapter, UniProtAdapter, DrugBankAdapter
        from knowledge_lookup.curie_utils import parse_curie_or_uri
        print("core OK:", len(ADAPTER_CLASSES), "adapters")
        PY

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: |
        pip install --upgrade pip
        pip install poetry
        poetry --version

    - name: Install dependencies
      run: |
        poetry install --with dev --no-interaction

    - name: Run Ruff linter
      run: |
        poetry run ruff check src/

    - name: Run Ruff formatter check
      run: |
        poetry run ruff format --check src/

    - name: Run mypy type checking
      run: |
        poetry run mypy src/

    - name: Run pre-commit
      run: |
        poetry run pre-commit run --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: |
        pip install --upgrade pip
        pip install poetry

    - name: Build package
      run: |
        poetry build --no-interaction

    - name: Verify distribution files
      run: |
        ls -la dist/
        python -m pip install dist/*.whl
        python -c "from knowledge_lookup import CentralKnowledgeLookup; print('Package import OK')"

    - name: Store distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        if-no-files-found: error
