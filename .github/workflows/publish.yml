name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "PyPI environment (testpypi or pypi)"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Verify: run quick checks before publishing
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history + tags — required for poetry-dynamic-versioning to
        # compute the version; a shallow checkout silently yields 0.0.0.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: |
        pip install --upgrade pip
        pip install poetry
        poetry --version

    - name: Check Poetry configuration
      run: |
        poetry check --no-interaction

    - name: Validate version
      run: |
        # `poetry version` needs the poetry-dynamic-versioning *plugin* (not
        # just the build backend) to see the computed version, so compute it
        # the same way the PEP 517 backend does instead of installing that
        # plugin here.
        pip install --quiet poetry-core poetry-dynamic-versioning
        VERSION=$(python -c "from pathlib import Path; import poetry_dynamic_versioning.patch as patch; patch.activate(); from poetry.core.factory import Factory; print(Factory().create_poetry(Path('.').resolve()).package.version)")
        echo "Package version: $VERSION"
        echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
        # Ensure version matches the git tag for tag-triggered runs
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: computed version ($VERSION) does not match tag ($TAG_VERSION)."
            echo "This should not happen if the tag was pushed normally — check"
            echo "fetch-depth: 0 above and that no local/dirty changes exist."
            exit 1
          fi
          echo "Version check: OK ($VERSION matches tag)"
        elif [[ "$VERSION" == *.dev0+* || "$VERSION" == *dirty* ]]; then
          # release-triggered runs build at the tag's commit, so this branch
          # is expected only for workflow_dispatch test runs off a non-tag ref.
          echo "::warning::Building a dev version ($VERSION) — not at a release tag."
        fi

    - name: Run lint checks
      run: |
        poetry install --with dev --no-interaction
        poetry run ruff check src/
        poetry run ruff format --check src/
        poetry run mypy src/ || true  # Don't block publishing on type issues

    - name: Run tests
      run: |
        poetry run pytest tests/unit -v --timeout=60

  # ---------------------------------------------------------------------------
  # Build: create distribution packages
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [verify]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # required for poetry-dynamic-versioning, see verify job

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: |
        pip install --upgrade pip
        pip install poetry

    - name: Build distribution
      run: |
        poetry build --no-interaction

    - name: Verify distribution
      run: |
        ls -la dist/
        python -m pip install dist/*.whl
        python -c "from knowledge_lookup import CentralKnowledgeLookup; print('Package import OK')"

    - name: Store distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Attest: generate Sigstore provenance attestations
  # ---------------------------------------------------------------------------
  attest:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Generate provenance attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: dist/*
        subject-name: ${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Publish: upload to PyPI using trusted publishing (OIDC)
  # ---------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [build, attest]
    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi' && 'https://test.pypi.org/project/biomedical-knowledge-lookup/' || 'https://pypi.org/project/biomedical-knowledge-lookup/' }}

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Display distribution files
      run: |
        ls -la dist/
        sha256sum dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        attestations: true
        verify-metadata: true
        skip-existing: true
        # For manual testpypi uploads
        repository-url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}

  # ---------------------------------------------------------------------------
  # Draft release notes (optional convenience)
  # ---------------------------------------------------------------------------
  github-release:
    runs-on: ubuntu-latest
    needs: [publish]
    # Normal path: a release is published (see release-draft.yml — it opens a
    # human-reviewed draft on every push to main; publishing it is *the*
    # release trigger). Fallback path: someone pushed a `vX.Y.Z` tag by hand
    # with no release yet.
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Attach distributions to the release
      uses: softprops/action-gh-release@v2
      with:
        # A release-published run already has real, human-reviewed notes
        # (from the draft) — only attach the built artifacts there. A direct
        # tag push has no release yet, so generate one from the CHANGELOG.
        body_path: ${{ github.event_name == 'push' && 'CHANGELOG.md' || '' }}
        generate_release_notes: ${{ github.event_name == 'push' }}
        files: dist/*
        make_latest: true
